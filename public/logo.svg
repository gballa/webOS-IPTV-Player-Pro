<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="45%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#07080d"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a6d" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#7928ca" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff2a6d" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Logo Icon Gradients -->
    <linearGradient id="tvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="45%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#0a0b12"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="meshGlowLeft" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#e60050" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e60050" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshGlowRight" cx="85%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect x="8" y="8" width="984" height="304" rx="20" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="984" height="304" rx="20" fill="url(#meshGlowLeft)"/>
  <rect x="8" y="8" width="984" height="304" rx="20" fill="url(#meshGlowRight)"/>
  <rect x="8" y="8" width="984" height="304" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Subtle Ambient TV Scanlines/Grid in Screen Mock -->
  <g opacity="0.07">
    <line x1="8" y1="40" x2="992" y2="40" stroke="#ffffff" stroke-width="1"/>
    <line x1="8" y1="80" x2="992" y2="80" stroke="#ffffff" stroke-width="1"/>
    <line x1="8" y1="120" x2="992" y2="120" stroke="#ffffff" stroke-width="1"/>
    <line x1="8" y1="160" x2="992" y2="160" stroke="#ffffff" stroke-width="1"/>
    <line x1="8" y1="200" x2="992" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="8" y1="240" x2="992" y2="240" stroke="#ffffff" stroke-width="1"/>
    <line x1="8" y1="280" x2="992" y2="280" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Left Icon: Stylized webOS 4K OLED TV Device & Streaming Pulse -->
  <g transform="translate(64, 52)">
    <!-- Ambient TV Glow -->
    <rect x="10" y="10" width="170" height="120" rx="14" fill="#ff0055" opacity="0.18" filter="url(#softGlow)"/>

    <!-- Outer TV Bezel -->
    <rect x="0" y="0" width="190" height="135" rx="16" fill="#181a24" stroke="url(#tvGrad)" stroke-width="3"/>

    <!-- TV Screen Inner -->
    <rect x="10" y="10" width="170" height="115" rx="10" fill="url(#screenGrad)"/>

    <!-- Inside Screen Graphics: Waveform / Broadcast Stream -->
    <path d="M 22 75 Q 45 40, 68 75 T 114 75 T 160 75" fill="none" stroke="url(#accentGlow)" stroke-width="4" stroke-linecap="round" filter="url(#badgeGlow)"/>
    <path d="M 22 88 Q 50 65, 78 88 T 134 88 T 160 88" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Inside Screen: Live Indicator & 4K Tag -->
    <circle cx="28" cy="26" r="4" fill="#ff0055"/>
    <circle cx="28" cy="26" r="8" fill="#ff0055" opacity="0.3"/>
    <text x="38" y="30" fill="#ff4d79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="1">LIVE 4K</text>

    <!-- LG / webOS Central Signal Node -->
    <circle cx="95" cy="50" r="14" fill="#241b35" stroke="url(#accentGlow)" stroke-width="2"/>
    <polygon points="91,43 103,50 91,57" fill="#ffffff"/>

    <!-- TV Stand -->
    <path d="M 75 135 L 70 162 L 120 162 L 115 135 Z" fill="#212433"/>
    <rect x="52" y="162" width="86" height="5" rx="2.5" fill="#434960"/>
    <rect x="65" y="163" width="60" height="3" rx="1.5" fill="url(#tvGrad)" opacity="0.8"/>
  </g>

  <!-- Central & Right Content: Typography & Brand -->
  <g transform="translate(290, 78)">
    <!-- Small Category Kicker -->
    <g transform="translate(0, 0)">
      <rect x="0" y="-18" width="142" height="22" rx="11" fill="#e60050" fill-opacity="0.15" stroke="#e60050" stroke-width="1"/>
      <circle cx="12" cy="-7" r="3.5" fill="#e60050"/>
      <text x="22" y="-4" fill="#ff3366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">LG SMART TV SUITE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="#ffffff">
      webOS IPTV Player
    </text>

    <!-- "PRO" Badge -->
    <g transform="translate(422, 2)">
      <rect x="0" y="4" width="76" height="38" rx="8" fill="url(#tvGrad)" filter="url(#badgeGlow)"/>
      <text x="38" y="30" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" letter-spacing="1.5" text-anchor="middle">PRO</text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#9ca3af" letter-spacing="0.2">
      Hardware-Accelerated 4K/HDR Engine • 10-Foot Spatial Living Room UX • Zero Telemetry
    </text>

    <!-- Pills / Feature Badges -->
    <g transform="translate(0, 102)">
      <!-- Pill 1: webOS 4.0 - 26+ -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="148" height="28" rx="6" fill="#171926" stroke="#2d3148" stroke-width="1"/>
        <circle cx="14" cy="14" r="4" fill="#a50034"/>
        <text x="26" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">webOS 4.0 — 26+</text>
      </g>

      <!-- Pill 2: Xtream + M3U8 -->
      <g transform="translate(156, 0)">
        <rect x="0" y="0" width="138" height="28" rx="6" fill="#171926" stroke="#2d3148" stroke-width="1"/>
        <circle cx="14" cy="14" r="4" fill="#7928ca"/>
        <text x="26" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Xtream • M3U • EPG</text>
      </g>

      <!-- Pill 3: Native HTML5 + MSE -->
      <g transform="translate(302, 0)">
        <rect x="0" y="0" width="154" height="28" rx="6" fill="#171926" stroke="#2d3148" stroke-width="1"/>
        <circle cx="14" cy="14" r="4" fill="#00f0ff"/>
        <text x="26" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">4K HDR • HLS • MPEG-TS</text>
      </g>

      <!-- Pill 4: Magic Remote -->
      <g transform="translate(464, 0)">
        <rect x="0" y="0" width="176" height="28" rx="6" fill="#171926" stroke="#2d3148" stroke-width="1"/>
        <circle cx="14" cy="14" r="4" fill="#10b981"/>
        <text x="26" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Spatial D-Pad &amp; Remote</text>
      </g>
    </g>
  </g>
</svg>
